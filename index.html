<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>カメラ翻訳 — English to Japanese</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b2638;--line:#34445d;--accent:#65e6c2;--text:#f4f7fb;--muted:#b5c1d3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif}
main{max-width:900px;margin:auto;padding:20px 14px 36px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:1.35rem;margin:0} .sub{color:var(--muted);font-size:.9rem;margin-top:3px}
.badge{border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--accent);font-size:.8rem;white-space:nowrap}
.stage{position:relative;overflow:hidden;border-radius:18px;background:#05080d;aspect-ratio:3/4;max-height:72vh;border:1px solid var(--line)}
video{width:100%;height:100%;object-fit:cover;display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;background:var(--accent);color:#09251e}
button.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.status{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--muted);font-size:.9rem}
.results{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.results h2{font-size:1rem;margin:0 0 8px}.entry{padding:9px 0;border-top:1px solid var(--line)}.entry:first-of-type{border-top:0}
.original{color:var(--muted);font-size:.88rem}.translated{font-size:1rem;font-weight:650}
.note{color:var(--muted);font-size:.82rem;margin-top:12px}
a{color:var(--accent)}
@media(min-width:650px){.stage{aspect-ratio:16/10;max-height:none}.head{margin-bottom:20px}}
</style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>📷 カメラ翻訳</h1><div class="sub">English → 日本語 · ライブ試作版</div></div>
    <div class="badge">Safari / Web</div>
  </div>
  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="empty" id="empty">カメラを開始すると、認識した英語の上に<br>日本語訳を重ねて表示します。</div>
  </div>
  <div class="controls">
    <button id="start">カメラを開始</button>
    <button id="stop" class="secondary" disabled>停止</button>
    <button id="refresh" class="secondary" disabled>今すぐ認識</button>
  </div>
  <div class="status" id="status" role="status">開始ボタンを押してカメラへのアクセスを許可してください。</div>
  <section class="results">
    <h2>認識・翻訳結果</h2>
    <div id="results"><div class="note">まだ文字を認識していません。</div></div>
  </section>
  <p class="note">試作のため、文字認識と翻訳にはインターネット接続が必要です。翻訳はMyMemoryの公開APIを利用します。機密情報・個人情報の撮影には使用しないでください。カメラはHTTPSまたはlocalhostで動作します。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const refreshBtn = document.getElementById('refresh');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('empty');
  let stream = null, worker = null, running = false, busy = false, timer = null;
  const cache = new Map();

  function status(s){ statusEl.textContent = s; }
  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(rect.width*dpr));
    canvas.height = Math.max(1, Math.round(rect.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resizeCanvas);

  async function translate(text){
    const key = text.trim().toLowerCase();
    if(cache.has(key)) return cache.get(key);
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|ja';
    const response = await fetch(url);
    if(!response.ok) throw new Error('翻訳サービスに接続できません');
    const data = await response.json();
    const translated = data?.responseData?.translatedText;
    if(!translated) throw new Error('翻訳結果がありません');
    cache.set(key, translated);
    return translated;
  }

  function drawBoxes(items){
    resizeCanvas();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    const vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh) return;
    // Match video.object-fit: cover coordinates, including crop.
    const scale = Math.max(w/vw,h/vh);
    const dw = vw*scale, dh = vh*scale;
    const ox = (w-dw)/2, oy = (h-dh)/2;
    items.forEach(item=>{
      const b=item.bbox;
      const x=ox+b.x0*scale, y=oy+b.y0*scale;
      const bw=(b.x1-b.x0)*scale, bh=(b.y1-b.y0)*scale;
      const label=item.ja || item.text;
      ctx.font='600 15px system-ui, sans-serif';
      const tw=ctx.measureText(label).width;
      const boxW=Math.min(w-8,Math.max(bw,tw+12));
      const boxH=Math.max(26,bh);
      ctx.fillStyle='rgba(7,24,30,.86)';
      ctx.strokeStyle='#65e6c2'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(Math.max(2,x),Math.max(2,y),boxW,boxH,5); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ffffff';
      ctx.fillText(label,Math.max(8,x+6),Math.max(18,y+boxH/2+5),boxW-12);
    });
  }

  function showResults(items){
    resultsEl.replaceChildren();
    if(!items.length){resultsEl.innerHTML='<div class="note">文字を検出できませんでした。カメラを文字に近づけ、明るさや角度を調整してください。</div>';return;}
    items.forEach(item=>{
      const row=document.createElement('div'); row.className='entry';
      const orig=document.createElement('div');orig.className='original';orig.textContent=item.text;
      const trans=document.createElement('div');trans.className='translated';trans.textContent=item.ja || '翻訳できませんでした';
      row.append(orig,trans);resultsEl.append(row);
    });
  }

  async function recognize(){
    if(!running || busy || !worker || video.readyState < 2) return;
    busy=true; refreshBtn.disabled=true;
    try{
      status('画像内の英語を認識しています…');
      const {data}=await worker.recognize(video);
      const lines=(data.lines||[])
        .filter(line=>line.text && line.text.trim().length>1 && /[A-Za-z]/.test(line.text))
        .slice(0,8);
      const items=[];
      for(const line of lines){
        const text=line.text.trim();
        let ja='';
        try{ja=await translate(text);}catch(e){ja='（翻訳エラー）';}
        items.push({text,ja,bbox:line.bbox});
      }
      drawBoxes(items); showResults(items);
      status(items.length ? `認識完了：${items.length}件。約2.5秒ごとに更新します。` : '英語の文字が見つかりません。文字にカメラを向けてください。');
    }catch(e){
      status('処理中にエラーが発生しました：'+(e.message||'不明なエラー'));
    }finally{
      busy=false; refreshBtn.disabled=!running;
    }
  }

  async function start(){
    try{
      startBtn.disabled=true;
      status('カメラを起動しています…');
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      video.srcObject=stream;
      await video.play();
      emptyEl.style.display='none';
      resizeCanvas();
      status('文字認識エンジンを準備しています（初回は少し時間がかかります）…');
      worker=await Tesseract.createWorker('eng',1,{logger:m=>{
        if(m.status==='recognizing text') status(`文字を認識しています… ${Math.round((m.progress||0)*100)}%`);
      }});
      running=true; stopBtn.disabled=false; refreshBtn.disabled=false;
      status('カメラ起動中。英語の文字を映してください。');
      recognize();
      timer=setInterval(recognize,2500);
    }catch(e){
      status('起動できませんでした。HTTPSで開いているか、Safariのカメラ許可を確認してください。詳細：'+(e.message||e));
      startBtn.disabled=false;
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream=null;
    }
  }

  async function stop(){
    running=false; clearInterval(timer); timer=null;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=null; video.srcObject=null;
    if(worker){await worker.terminate();worker=null;}
    ctx.clearRect(0,0,canvas.width,canvas.height);
    emptyEl.style.display='grid';
    startBtn.disabled=false; stopBtn.disabled=true; refreshBtn.disabled=true;
    status('停止しました。');
  }
  startBtn.addEventListener('click',start);
  stopBtn.addEventListener('click',stop);
  refreshBtn.addEventListener('click',recognize);
})();
</script>
</body>
</html>
